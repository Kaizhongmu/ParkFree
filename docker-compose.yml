services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_ai}
      POSTGRES_USER: ${POSTGRES_USER:-parking_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-parking_ai} -d ${POSTGRES_DB:-parking_ai}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: ${ENV_FILE:-.env.example}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parking_ai}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-parking_ai}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parking_ai}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-parking_ai}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
